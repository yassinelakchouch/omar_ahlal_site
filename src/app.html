<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Starting states hide only once this runs, never without JavaScript. Every full load opens with the loader;
			// if GSAP isn't ready in 4 s, the page is shown still.
			var h = document.documentElement;
			h.dataset.motion = 'on';
			h.classList.add('first');
			setTimeout(function () {
				if (!window.__motionReady) {
					h.dataset.motion = 'off';
					h.classList.remove('first');
				}
			}, 4000);
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
